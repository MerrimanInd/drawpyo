# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: publish-to-pypi

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Verify installed distribution and release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 -m pip install dist/*.whl
          python3 - <<'PY'
          import os
          from importlib.metadata import version
          import drawpyo

          package_version = version("drawpyo")
          assert package_version == drawpyo.__version__, "Package and module versions differ"
          assert callable(drawpyo.load_mxlibrary)
          assert callable(drawpyo.register_mxlibrary)
          tag = os.environ["RELEASE_TAG"]
          if tag:
              assert tag == package_version, f"Tag {tag} does not match package version {package_version}"
          PY
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          
  publish-to-pypi:
    name: >-
      Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/drawpyo
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
